<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"
     preserveAspectRatio="xMidYMid slice">
  <!--
    An original backdrop for the bili-purge console, not Bilibili artwork.

    It borrows only the public brand colours (#FB7299 pink, #23ADE5 blue) and the
    two shapes the product home is actually recognisable by: a grid of video-card
    covers, and danmaku drifting across them. Everything here is drawn from
    scratch, so this file can ship with the tool.
  -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171c"/>
      <stop offset="0.55" stop-color="#101217"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>

    <radialGradient id="glowPink" cx="0.12" cy="0.06" r="0.62">
      <stop offset="0" stop-color="#FB7299" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#FB7299" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#FB7299" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue" cx="0.92" cy="0.9" r="0.68">
      <stop offset="0" stop-color="#23ADE5" stop-opacity="0.3"/>
      <stop offset="0.45" stop-color="#23ADE5" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#23ADE5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>

    <!-- One video-card cover plus its title skeleton, on the home feed's pitch. -->
    <pattern id="feed" width="248" height="184" patternUnits="userSpaceOnUse">
      <rect x="14" y="14" width="220" height="124" rx="10"
            fill="#FB7299" fill-opacity="0.014"
            stroke="#FB7299" stroke-opacity="0.075" stroke-width="1.4"/>
      <rect x="14" y="152" width="126" height="9" rx="4.5" fill="#9499a0" fill-opacity="0.055"/>
      <rect x="14" y="167" width="72" height="7" rx="3.5" fill="#9499a0" fill-opacity="0.035"/>
    </pattern>

    <pattern id="feedOffset" width="248" height="184" patternUnits="userSpaceOnUse"
             patternTransform="translate(124 92)">
      <rect x="14" y="14" width="220" height="124" rx="10"
            fill="#23ADE5" fill-opacity="0.012"
            stroke="#23ADE5" stroke-opacity="0.06" stroke-width="1.4"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#feed)"/>
  <rect width="1600" height="1000" fill="url(#feedOffset)"/>
  <rect width="1600" height="1000" fill="url(#glowPink)"/>
  <rect width="1600" height="1000" fill="url(#glowBlue)"/>

  <!-- Danmaku: the one interaction the platform is actually known for. -->
  <g>
    <rect x="108"  y="128" width="196" height="8" rx="4" fill="#FB7299" fill-opacity="0.3"/>
    <rect x="372"  y="96"  width="128" height="8" rx="4" fill="#ffffff" fill-opacity="0.13"/>
    <rect x="560"  y="176" width="232" height="8" rx="4" fill="#23ADE5" fill-opacity="0.24"/>
    <rect x="862"  y="118" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="1062" y="196" width="204" height="8" rx="4" fill="#FB7299" fill-opacity="0.22"/>
    <rect x="1330" y="140" width="164" height="8" rx="4" fill="#23ADE5" fill-opacity="0.2"/>
    <rect x="86"   y="432" width="152" height="8" rx="4" fill="#23ADE5" fill-opacity="0.18"/>
    <rect x="288"  y="486" width="238" height="8" rx="4" fill="#FB7299" fill-opacity="0.2"/>
    <rect x="596"  y="418" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.09"/>
    <rect x="774"  y="512" width="186" height="8" rx="4" fill="#23ADE5" fill-opacity="0.16"/>
    <rect x="1018" y="446" width="142" height="8" rx="4" fill="#FB7299" fill-opacity="0.16"/>
    <rect x="1218" y="522" width="216" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="1466" y="452" width="104" height="8" rx="4" fill="#FB7299" fill-opacity="0.14"/>
    <rect x="142"  y="768" width="184" height="8" rx="4" fill="#FB7299" fill-opacity="0.16"/>
    <rect x="402"  y="822" width="132" height="8" rx="4" fill="#23ADE5" fill-opacity="0.15"/>
    <rect x="622"  y="744" width="224" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="912"  y="800" width="168" height="8" rx="4" fill="#23ADE5" fill-opacity="0.14"/>
    <rect x="1146" y="866" width="200" height="8" rx="4" fill="#FB7299" fill-opacity="0.15"/>
    <rect x="1402" y="786" width="140" height="8" rx="4" fill="#ffffff" fill-opacity="0.07"/>
  </g>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>
